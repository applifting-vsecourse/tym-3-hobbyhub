<style>
/* Layout: sticky model tree on the left (stacks on top at phone width), one routed view on the right:
   overview, zoomable diagram with clickable class boxes, or a class sheet in UML compartments. */
:root {
  --bg: #f4f6f8;
  --surface: #ffffff;
  --sunken: #eceff3;
  --ink: #1a2230;
  --muted: #5b6676;
  --line: #d8dee6;
  --accent: #1d6a85;
  --accent-soft: #e1eef3;
  --uml: #9a7a3a;        /* echoes the brown border of Modelio class boxes */
  --uml-soft: #f7efdc;
  --hot: rgba(29, 106, 133, .16);
  --font-display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --step--1: .8125rem; --step-0: .9375rem; --step-1: 1.125rem; --step-2: 1.5rem; --step-3: 2.125rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11151b; --surface: #181d25; --sunken: #1f2530; --ink: #e2e7ee; --muted: #9aa5b4;
    --line: #2c3442; --accent: #6bb8d4; --accent-soft: #1b3440; --uml: #d2b06a; --uml-soft: #2c2618;
    --hot: rgba(107, 184, 212, .2); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11151b; --surface: #181d25; --sunken: #1f2530; --ink: #e2e7ee; --muted: #9aa5b4;
  --line: #2c3442; --accent: #6bb8d4; --accent-soft: #1b3440; --uml: #d2b06a; --uml-soft: #2c2618;
  --hot: rgba(107, 184, 212, .2); color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: var(--step-0); line-height: 1.55; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; text-wrap: balance; line-height: 1.15; margin: 0; }
h1 { font-size: var(--step-3); letter-spacing: -.01em; }
h2 { font-size: var(--step-1); }
code, .mono { font-family: var(--font-mono); font-size: .86em; }
.eyebrow { font-size: var(--step--1); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 500; }

.app { display: grid; grid-template-columns: 17.5rem minmax(0, 1fr); min-height: 100vh; }
aside { border-right: 1px solid var(--line); background: var(--surface); position: sticky; top: env(safe-area-inset-top, 0px);
  height: 100vh; overflow-y: auto; padding: 1.25rem 1rem 2rem; display: flex; flex-direction: column; gap: 1.1rem; }
.brand { display: flex; flex-direction: column; gap: .15rem; }
.brand a { color: var(--ink); font-family: var(--font-display); font-size: 1.35rem; font-weight: 600; }
.brand span { color: var(--muted); font-size: var(--step--1); }
.search { width: 100%; padding: .55rem .7rem; border: 1px solid var(--line); border-radius: 6px; background: var(--bg);
  color: var(--ink); font: inherit; font-size: var(--step--1); }
nav details { display: flex; flex-direction: column; }
nav summary { cursor: pointer; list-style: none; }
nav summary::-webkit-details-marker { display: none; }
nav summary h3 { color: var(--ink); }
nav summary .toggle { font-family: var(--font-mono); text-transform: none; letter-spacing: 0; color: var(--muted); }
nav summary .toggle::after { content: " ▾"; }
nav details:not([open]) summary .toggle::after { content: " ▸"; }
.navgroup { display: flex; flex-direction: column; gap: .1rem; margin-top: .9rem; }
.navgroup h3 { font-family: var(--font-body); font-size: var(--step--1); text-transform: uppercase; letter-spacing: .08em;
  color: var(--muted); font-weight: 500; display: flex; justify-content: space-between; gap: .5rem; margin-bottom: .2rem; }
.navgroup h3 code { text-transform: none; letter-spacing: 0; font-weight: 400; }
.navlink { display: flex; justify-content: space-between; gap: .5rem; padding: .22rem .5rem; border-radius: 5px; color: var(--ink);
  font-size: var(--step--1); }
.navlink:hover { background: var(--sunken); text-decoration: none; }
.navlink.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.navlink small { color: var(--muted); font-family: var(--font-mono); font-size: .72rem; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.navlink i { font-style: italic; }
.empty-nav { color: var(--muted); font-size: var(--step--1); padding: .3rem .5rem; }

main { padding-inline: clamp(1rem, 3vw, 2.75rem); padding-block: 1.75rem 4rem; min-width: 0; display: flex; flex-direction: column; gap: 1.75rem; }
.crumbs { font-size: var(--step--1); color: var(--muted); display: flex; gap: .4rem; flex-wrap: wrap; }
.head { display: flex; flex-direction: column; gap: .5rem; max-width: 60rem; }
.lede { color: var(--muted); max-width: 65ch; margin: 0; }

.stats { display: flex; flex-wrap: wrap; gap: .5rem 2rem; }
.stat { display: flex; flex-direction: column; }
.stat b { font-family: var(--font-display); font-size: var(--step-2); font-weight: 600; font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); font-size: var(--step--1); }

.thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr)); gap: 1rem; }
.thumb { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); overflow: hidden; color: var(--ink); }
.thumb:hover { border-color: var(--accent); text-decoration: none; }
.thumb .pic { aspect-ratio: 16 / 10; background: #fff; display: grid; place-items: center; padding: .5rem; border-bottom: 1px solid var(--line); max-width: 100%; }
.thumb img { max-height: 100%; object-fit: contain; }
.thumb .cap { padding: .6rem .8rem; display: flex; flex-direction: column; gap: .1rem; }
.thumb .cap b { font-family: var(--font-display); font-size: var(--step-1); font-weight: 600; }
.thumb .cap span { color: var(--muted); font-size: var(--step--1); }

.pkgs { display: grid; grid-template-columns: repeat(auto-fill, minmax(17rem, 1fr)); gap: 1.25rem 2rem; }
.pkg { display: flex; flex-direction: column; gap: .4rem; }
.pkg h2 { display: flex; align-items: baseline; gap: .5rem; flex-wrap: wrap; }
.pkg h2 code { color: var(--muted); font-weight: 400; font-size: .72em; }
.chips { display: flex; flex-wrap: wrap; gap: .35rem; }
.chip { display: inline-flex; align-items: center; gap: .3rem; padding: .12rem .5rem; border: 1px solid var(--line); border-radius: 4px;
  background: var(--surface); color: var(--ink); font-family: var(--font-mono); font-size: .78rem; }
a.chip:hover { border-color: var(--accent); color: var(--accent); text-decoration: none; }
.chip.k-Class { border-color: color-mix(in srgb, var(--uml) 45%, var(--line)); background: var(--uml-soft); }
.chip i { font-style: italic; }

/* diagram viewer */
.toolbar { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .35rem; min-width: 2.25rem; height: 2.1rem; padding: 0 .75rem;
  border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); font: inherit; font-size: var(--step--1); cursor: pointer; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.zoomval { font-family: var(--font-mono); font-size: .8rem; color: var(--muted); min-width: 3.5rem; text-align: center; font-variant-numeric: tabular-nums; }
.hint { color: var(--muted); font-size: var(--step--1); }
.stage { border: 1px solid var(--line); border-radius: 8px; background: #fff; overflow: auto; max-height: calc(100vh - 13rem); min-height: 18rem;
  cursor: grab; touch-action: pan-x pan-y; }
.stage.dragging { cursor: grabbing; user-select: none; }
.canvas { position: relative; margin: 0 auto; }
.canvas img { display: block; width: 100%; max-width: none; height: auto; pointer-events: none; user-select: none; }
.hot { position: absolute; border-radius: 2px; border: 2px solid transparent; background: transparent; cursor: pointer; padding: 0; }
.hot:hover, .hot:focus-visible { border-color: var(--accent); background: var(--hot); outline: none; }
.hot.flash { border-color: var(--accent); background: var(--hot); animation: pulse 1.2s ease-in-out 3; }
@keyframes pulse { 50% { box-shadow: 0 0 0 6px var(--hot); } }
@media (prefers-reduced-motion: reduce) { .hot.flash { animation: none; } }

/* class sheet */
.sheet-head { display: flex; flex-direction: column; gap: .55rem; max-width: 65rem; }
.stereo { font-family: var(--font-mono); font-size: var(--step--1); color: var(--uml); }
h1.abstract { font-style: italic; }
.meta { display: flex; flex-wrap: wrap; gap: .4rem 1.25rem; color: var(--muted); font-size: var(--step--1); }
.note { border-left: 3px solid var(--uml); background: var(--uml-soft); padding: .6rem .9rem; border-radius: 0 6px 6px 0; max-width: 65ch; white-space: pre-line; }
section { display: flex; flex-direction: column; gap: .7rem; }
section > header { display: flex; align-items: baseline; gap: .6rem; flex-wrap: wrap; }
section > header .count { color: var(--muted); font-family: var(--font-mono); font-size: .8rem; }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: var(--step--1); }
th { text-align: left; font-weight: 500; color: var(--muted); font-size: .75rem; text-transform: uppercase; letter-spacing: .06em;
  padding: .5rem .75rem; border-bottom: 1px solid var(--line); background: var(--sunken); white-space: nowrap; }
td { padding: .5rem .75rem; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
td.sig { font-family: var(--font-mono); font-size: .8rem; white-space: nowrap; }
td.mult { font-family: var(--font-mono); font-size: .8rem; white-space: nowrap; font-variant-numeric: tabular-nums; color: var(--muted); }
td.desc { color: var(--muted); min-width: 14rem; }
td.desc .formula { font-family: var(--font-mono); font-size: .78rem; color: var(--ink); white-space: pre-line; }
.vis { color: var(--muted); display: inline-block; width: 1ch; }
.tag { display: inline-block; font-family: var(--font-body); font-size: .68rem; text-transform: uppercase; letter-spacing: .06em;
  padding: .02rem .35rem; border-radius: 3px; margin-left: .35rem; vertical-align: .08em; border: 1px solid var(--line); color: var(--muted); }
.tag.derived { border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); color: var(--accent); }
.tag.comp { border-color: color-mix(in srgb, var(--uml) 55%, var(--line)); color: var(--uml); }
.tag.rule { cursor: pointer; background: transparent; font: inherit; font-size: .68rem; }
.rules { display: flex; flex-direction: column; gap: .4rem; margin: 0; padding: 0; list-style: none; max-width: 70rem; }
.rules li { display: flex; gap: .75rem; align-items: baseline; flex-wrap: wrap; padding: .5rem .75rem; border: 1px solid var(--line);
  border-radius: 6px; background: var(--surface); }
.rules li.lit { background: var(--accent-soft); border-color: var(--accent); }
.rules .on { font-family: var(--font-mono); font-size: .75rem; color: var(--muted); min-width: 9rem; }
.rules .txt { font-family: var(--font-mono); font-size: .82rem; min-width: 0; overflow-wrap: anywhere; }
.rules .nm { font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--uml); }
.ops { display: flex; flex-direction: column; gap: .35rem; margin: 0; padding: 0; list-style: none; }
.ops li { display: flex; flex-direction: column; gap: .1rem; padding: .5rem .75rem; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; }
.ops code { overflow-wrap: anywhere; }
.ops span { color: var(--muted); font-size: var(--step--1); }
.lits { display: flex; flex-wrap: wrap; gap: .35rem; }
.twocol { display: grid; grid-template-columns: repeat(auto-fit, minmax(18rem, 1fr)); gap: 1.75rem; }
.mini { display: grid; grid-template-columns: repeat(auto-fill, minmax(11rem, 1fr)); gap: .75rem; }
.mini a { display: flex; flex-direction: column; gap: .3rem; border: 1px solid var(--line); border-radius: 6px; padding: .5rem; background: var(--surface); color: var(--ink); font-size: var(--step--1); }
.mini a:hover { border-color: var(--accent); text-decoration: none; }
.mini .crop { position: relative; aspect-ratio: 4 / 3; overflow: hidden; background: #fff; border-radius: 3px; max-width: 100%; }
.mini .crop img { position: absolute; max-width: none; }
.muted { color: var(--muted); }
footer { color: var(--muted); font-size: var(--step--1); border-top: 1px solid var(--line); padding-top: 1rem; max-width: 65ch; }

@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  aside { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 1rem; }
  .stage { max-height: 70vh; }
}
</style>

<script>
(() => {
  const MODEL = JSON.parse(document.getElementById('model-data').textContent);
  const BOXES = JSON.parse(document.getElementById('box-data').textContent);
  const IMG = JSON.parse(document.getElementById('img-data').textContent);
  const PKG = {
    events: 'Akce', users: 'Uživatelé', groups: 'Skupiny', moderation: 'Moderace',
    abstract: 'Abstraktní předci', enums: 'Výčty', _DataTypes: 'Datové typy'
  };
  const PKG_ORDER = ['events', 'users', 'groups', 'moderation', 'abstract', '_DataTypes', 'enums'];
  const DIAGRAMS = [
    { key: 'Event', title: 'Akce', text: 'Akce, účast, žádosti, nástěnka a hodnocení' },
    { key: 'User', title: 'Uživatel', text: 'Profil, zájmy a nákupy topování' },
    { key: 'Group', title: 'Skupiny', text: 'Skupiny, členství a žádosti o členství' },
    { key: 'Moderation', title: 'Moderace', text: 'Nahlášení, správci, audit a žádosti o data' }
  ];
  const KIND = { Class: 'třída', Enumeration: 'výčet', DataType: 'datový typ', PrimitiveType: 'primitivní typ' };
  const byName = Object.fromEntries(MODEL.elements.map(e => [e.name, e]));
  const view = document.getElementById('view');
  const nav = document.getElementById('nav');
  const q = document.getElementById('q');
  const state = { zoom: {}, flash: null, rule: null };

  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const link = n => byName[n] ? `<a href="#c-${n}">${esc(n)}</a>` : esc(n ?? '—');
  const mult = m => m === '0..*' ? '*' : (m ?? '');
  const elLabel = e => e.abstract ? `<i>${esc(e.name)}</i>` : esc(e.name);
  const diagramsOf = name => DIAGRAMS.filter(d => (BOXES[d.key]?.boxes || []).some(b => b.name === name));
  const typeLabel = a => a.type ? link(a.type) : '<span class="muted">bez typu</span>';
  const stereo = e => e.abstract ? '«abstract»' : e.kind === 'Enumeration' ? '«enumeration»' : e.kind === 'DataType' ? '«datatype»' : e.kind === 'PrimitiveType' ? '«primitive»' : '';

  /* ---------- navigation ---------- */
  function renderNav(filter = '') {
    const f = filter.trim().toLowerCase();
    let html = '<div class="navgroup"><h3>Diagramy</h3>' +
      DIAGRAMS.map(d => `<a class="navlink" data-r="d-${d.key}" href="#d-${d.key}">${esc(d.title)}<small>${(BOXES[d.key]?.boxes || []).length} prvků</small></a>`).join('') + '</div>';
    let any = false, tree = '';
    for (const p of PKG_ORDER) {
      const items = MODEL.elements.filter(e => e.package === p).map(e => {
        if (!f) return { e };
        if (e.name.toLowerCase().includes(f)) return { e };
        const hit = [...e.attributes, ...e.operations, ...e.literals].find(x => x.name.toLowerCase().includes(f));
        return hit ? { e, hit: hit.name } : null;
      }).filter(Boolean);
      if (!items.length) continue;
      any = true;
      tree += `<div class="navgroup"><h3>${esc(PKG[p] || p)} <code>${esc(p)}</code></h3>` +
        items.map(({ e, hit }) => `<a class="navlink" data-r="c-${e.name}" href="#c-${e.name}">${elLabel(e)}${hit ? `<small>${esc(hit)}</small>` : ''}</a>`).join('') + '</div>';
    }
    if (f && !any) tree = `<p class="empty-nav">Nic neodpovídá „${esc(filter)}“.</p>`;
    const open = f || matchMedia('(min-width: 861px)').matches;
    html += `<details class="tree"${open ? ' open' : ''}><summary class="navgroup"><h3>Prvky modelu <span class="toggle">${MODEL.elements.length}</span></h3></summary>${tree}</details>`;
    nav.innerHTML = html;
    markActive();
  }
  function markActive() {
    const r = location.hash.slice(1);
    nav.querySelectorAll('.navlink').forEach(a => a.classList.toggle('active', a.dataset.r === r));
  }
  q.addEventListener('input', () => renderNav(q.value));

  /* ---------- overview ---------- */
  function overview() {
    const cls = MODEL.elements.filter(e => e.kind === 'Class');
    const enums = MODEL.elements.filter(e => e.kind === 'Enumeration');
    const attrs = cls.reduce((n, e) => n + e.attributes.length, 0);
    const rules = MODEL.elements.reduce((n, e) => n + e.constraints.length, 0);
    const ops = cls.reduce((n, e) => n + e.operations.length, 0);
    view.innerHTML = `
      <div class="head">
        <span class="eyebrow">Doménový model · ${MODEL.packages.length} balíčků</span>
        <h1>HobbyHub</h1>
        <p class="lede">Prohlížeč modelu tříd exportovaného z Modelia. Kliknutím na třídu v diagramu otevřete její atributy, vazby, operace a omezení.</p>
      </div>
      <div class="stats">
        <div class="stat"><b>${cls.length}</b><span>tříd</span></div>
        <div class="stat"><b>${attrs}</b><span>atributů a konců vazeb</span></div>
        <div class="stat"><b>${ops}</b><span>operací</span></div>
        <div class="stat"><b>${rules}</b><span>omezení</span></div>
        <div class="stat"><b>${enums.length}</b><span>výčtů</span></div>
      </div>
      <section><header><h2>Diagramy</h2></header>
        <div class="thumbs">${DIAGRAMS.map(d => `
          <a class="thumb" href="#d-${d.key}"><div class="pic"><img src="${IMG[d.key]}" alt="Diagram ${esc(d.title)}" loading="lazy"></div>
          <div class="cap"><b>${esc(d.title)}</b><span>${esc(d.text)}</span></div></a>`).join('')}
        </div>
      </section>
      <section><header><h2>Balíčky</h2></header>
        <div class="pkgs">${PKG_ORDER.map(p => {
          const items = MODEL.elements.filter(e => e.package === p);
          return `<div class="pkg"><h2>${esc(PKG[p] || p)} <code>${esc(p)}</code></h2><div class="chips">${items.map(e =>
            `<a class="chip k-${e.kind}" href="#c-${e.name}">${elLabel(e)}</a>`).join('')}</div></div>`;
        }).join('')}</div>
      </section>
      ${footer()}`;
  }

  /* ---------- diagram ---------- */
  function diagram(key) {
    const d = DIAGRAMS.find(x => x.key === key);
    const bx = BOXES[key];
    if (!d || !bx) return notFound();
    const names = [...new Set(bx.boxes.map(b => b.name))];
    view.innerHTML = `
      <div class="head">
        <div class="crumbs"><a href="#prehled">Přehled</a><span>/</span><span>Diagramy</span></div>
        <span class="eyebrow">Diagram tříd</span>
        <h1>${esc(d.title)}</h1>
        <p class="lede">${esc(d.text)}.</p>
      </div>
      <div class="toolbar">
        <button class="btn" id="zo" type="button" aria-label="Oddálit">−</button>
        <span class="zoomval" id="zv"></span>
        <button class="btn" id="zi" type="button" aria-label="Přiblížit">+</button>
        <button class="btn" id="zf" type="button">Na šířku</button>
        <button class="btn" id="z1" type="button">100 %</button>
        <span class="hint">Klikněte na třídu · tažením posunete · Ctrl + kolečko přibližuje</span>
      </div>
      <div class="stage" id="stage"><div class="canvas" id="canvas">
        <img src="${IMG[key]}" alt="Diagram tříd ${esc(d.title)}" width="${bx.width}" height="${bx.height}">
        ${bx.boxes.map(b => `<button class="hot" type="button" data-n="${esc(b.name)}" title="${esc(b.name)}" aria-label="Otevřít ${esc(b.name)}"
          style="left:${b.x / bx.width * 100}%;top:${b.y / bx.height * 100}%;width:${b.w / bx.width * 100}%;height:${b.h / bx.height * 100}%"></button>`).join('')}
      </div></div>
      <section><header><h2>Prvky v diagramu</h2><span class="count">${names.length}</span></header>
        <div class="chips">${names.map(n => `<a class="chip k-${byName[n]?.kind}" href="#c-${n}">${byName[n] ? elLabel(byName[n]) : esc(n)}</a>`).join('')}</div>
      </section>
      ${footer()}`;

    const stage = document.getElementById('stage'), canvas = document.getElementById('canvas'), zv = document.getElementById('zv');
    const fit = () => Math.min(1, (stage.clientWidth - 2) / bx.width);
    let z = state.zoom[key] ?? fit();
    const apply = (nz, cx, cy) => {
      const old = z; z = Math.max(.2, Math.min(3, nz)); state.zoom[key] = z;
      const px = cx ?? stage.clientWidth / 2, py = cy ?? stage.clientHeight / 2;
      const sx = (stage.scrollLeft + px) / old, sy = (stage.scrollTop + py) / old;
      canvas.style.width = bx.width * z + 'px';
      zv.textContent = Math.round(z * 100) + ' %';
      stage.scrollLeft = sx * z - px; stage.scrollTop = sy * z - py;
    };
    canvas.style.width = bx.width * z + 'px'; zv.textContent = Math.round(z * 100) + ' %';
    document.getElementById('zi').onclick = () => apply(z * 1.25);
    document.getElementById('zo').onclick = () => apply(z / 1.25);
    document.getElementById('zf').onclick = () => { apply(fit()); stage.scrollLeft = 0; };
    document.getElementById('z1').onclick = () => apply(1);
    stage.addEventListener('wheel', ev => {
      if (!ev.ctrlKey) return;
      ev.preventDefault();
      const r = stage.getBoundingClientRect();
      apply(z * (ev.deltaY < 0 ? 1.12 : 1 / 1.12), ev.clientX - r.left, ev.clientY - r.top);
    }, { passive: false });
    let drag = null, moved = false;
    stage.addEventListener('pointerdown', ev => {
      if (ev.pointerType !== 'mouse' || ev.button !== 0) return;
      drag = { x: ev.clientX, y: ev.clientY, l: stage.scrollLeft, t: stage.scrollTop }; moved = false;
    });
    window.addEventListener('pointermove', ev => {
      if (!drag) return;
      const dx = ev.clientX - drag.x, dy = ev.clientY - drag.y;
      if (Math.abs(dx) + Math.abs(dy) > 4) { moved = true; stage.classList.add('dragging'); }
      stage.scrollLeft = drag.l - dx; stage.scrollTop = drag.t - dy;
    });
    window.addEventListener('pointerup', () => { drag = null; stage.classList.remove('dragging'); });
    canvas.querySelectorAll('.hot').forEach(h => h.addEventListener('click', ev => {
      if (moved) { ev.preventDefault(); moved = false; return; }
      location.hash = 'c-' + h.dataset.n;
    }));
    if (state.flash) {
      const target = canvas.querySelector(`.hot[data-n="${CSS.escape(state.flash)}"]`);
      state.flash = null;
      if (target) {
        target.classList.add('flash');
        requestAnimationFrame(() => {
          const b = bx.boxes.find(x => x.name === target.dataset.n);
          stage.scrollLeft = (b.x + b.w / 2) * z - stage.clientWidth / 2;
          stage.scrollTop = (b.y + b.h / 2) * z - stage.clientHeight / 2;
          target.focus({ preventScroll: true });
        });
      }
    }
  }

  /* ---------- class sheet ---------- */
  function sheet(name) {
    const e = byName[name];
    if (!e) return notFound();
    const plain = e.attributes.filter(a => !a.assoc);
    const ends = e.attributes.filter(a => a.assoc);
    const rulesFor = m => e.constraints.filter(c => c.member === m);
    const usedBy = e.incoming || [];
    const asType = usedBy.filter(u => !u.assoc);
    const assocIn = usedBy.filter(u => u.assoc);
    const diags = diagramsOf(e.name);
    const ancestors = [];
    for (let g = e.generals[0]; g && byName[g]; g = byName[g].generals[0]) ancestors.push(byName[g]);
    const inherited = ancestors.flatMap(a => a.attributes.map(x => ({ ...x, from: a.name })));

    const ruleTag = m => { const n = rulesFor(m).length; return n ? `<button class="tag rule" type="button" data-rule="${esc(m)}" title="Omezení na ${esc(m)}">${n} omez.</button>` : ''; };
    const attrRow = (a, from) => {
      const desc = [];
      if (a.comment) desc.push(a.derived ? `<span class="formula">${esc(a.comment)}</span>` : esc(a.comment));
      if (a.default) desc.push(`výchozí: <code>${esc(a.default)}</code>`);
      if (from) desc.push(`zděděno z ${link(from)}`);
      return `<tr>
        <td class="sig"><span class="vis">${a.visibility === 'private' ? '-' : '+'}</span>${a.derived ? '/' : ''}${esc(a.name)}${a.derived ? '<span class="tag derived">odvozený</span>' : ''}${a.readOnly ? '<span class="tag">readOnly</span>' : ''}${from ? '' : ruleTag(a.name)}</td>
        <td class="sig">${typeLabel(a)}</td>
        <td class="mult">${esc(mult(a.mult))}</td>
        <td class="desc">${desc.join('<br>') || ''}</td></tr>`;
    };
    const opSig = o => `${esc(o.name)}(${o.params.map(p => `${esc(p.name || '')}: ${p.type ? link(p.type) : '?'}`).join(', ')})${o.returns ? ': ' + link(o.returns) : ''}`;

    let html = `
      <div class="sheet-head">
        <div class="crumbs"><a href="#prehled">Přehled</a><span>/</span><span>${esc(PKG[e.package] || e.package)}</span><span>/</span><span>${esc(e.name)}</span></div>
        ${stereo(e) ? `<span class="stereo">${stereo(e)}</span>` : ''}
        <h1 class="${e.abstract ? 'abstract' : ''}">${esc(e.name)}</h1>
        <div class="meta">
          <span>${KIND[e.kind] || e.kind} v balíčku <code>${esc(e.package)}</code></span>
          ${e.generals.length ? `<span>dědí z ${e.generals.map(link).join(', ')}</span>` : ''}
          ${e.specializations.length ? `<span>potomci: ${e.specializations.map(link).join(', ')}</span>` : ''}
          ${diags.length ? `<span>v diagramu ${diags.map(d => `<a href="#d-${d.key}" data-flash="${esc(e.name)}">${esc(d.title)}</a>`).join(', ')}</span>` : '<span>není v žádném diagramu</span>'}
        </div>
        ${e.comment ? `<div class="note">${esc(e.comment)}</div>` : ''}
      </div>`;

    if (e.literals.length) html += `<section><header><h2>Literály</h2><span class="count">${e.literals.length}</span></header>
      <div class="lits">${e.literals.map(l => `<span class="chip">${esc(l.name)}</span>`).join('')}</div></section>`;

    if (plain.length || inherited.length) html += `<section><header><h2>Atributy</h2><span class="count">${plain.length}${inherited.length ? ` + ${inherited.length} zděděné` : ''}</span></header>
      <div class="tablewrap"><table><thead><tr><th>Atribut</th><th>Typ</th><th>Násobnost</th><th>Poznámka</th></tr></thead>
      <tbody>${plain.map(a => attrRow(a)).join('')}${inherited.filter(a => !a.assoc).map(a => attrRow(a, a.from)).join('')}</tbody></table></div></section>`;

    if (ends.length) html += `<section><header><h2>Vazby</h2><span class="count">${ends.length}</span></header>
      <div class="tablewrap"><table><thead><tr><th>Role</th><th>Cílová třída</th><th>Násobnost</th><th>Druhý konec</th><th>Druh</th></tr></thead>
      <tbody>${ends.map(a => `<tr>
        <td class="sig"><span class="vis">+</span>${esc(a.name)}${ruleTag(a.name)}</td>
        <td class="sig">${typeLabel(a)}</td>
        <td class="mult">${esc(mult(a.mult))}</td>
        <td class="mult">${a.assoc.oppositeMult ? esc(mult(a.assoc.oppositeMult)) : '—'}${a.assoc.oppositeName ? ` <span class="muted">(${esc(a.assoc.oppositeName)})</span>` : ''}</td>
        <td>${a.assoc.aggregation === 'composite' ? '<span class="tag comp">kompozice</span>' : a.assoc.aggregation === 'shared' ? '<span class="tag">agregace</span>' : '<span class="muted">asociace</span>'}</td>
      </tr>`).join('')}</tbody></table></div></section>`;

    if (e.operations.length || ancestors.some(a => a.operations.length)) {
      const inhOps = ancestors.flatMap(a => a.operations.map(o => ({ ...o, from: a.name })));
      html += `<section><header><h2>Operace</h2><span class="count">${e.operations.length}${inhOps.length ? ` + ${inhOps.length} zděděné` : ''}</span></header>
        <ul class="ops">${[...e.operations, ...inhOps].map(o => `<li><code>+ ${opSig(o)}</code>${ruleTag(o.name + '()') ? `<div>${ruleTag(o.name + '()')}</div>` : ''}${o.comment ? `<span>${esc(o.comment)}</span>` : ''}${o.from ? `<span>zděděno z ${link(o.from)}</span>` : ''}</li>`).join('')}</ul></section>`;
    }

    if (e.constraints.length) html += `<section id="rules"><header><h2>Omezení</h2><span class="count">${e.constraints.length}</span></header>
      <ul class="rules">${e.constraints.map(c => `<li data-member="${esc(c.member || '')}"><span class="on">${c.member ? esc(c.member) : 'celá třída'}</span>
        <span class="txt">${esc(c.text)}</span>${c.name ? `<span class="nm">${esc(c.name)}</span>` : ''}</li>`).join('')}</ul></section>`;

    if (usedBy.length) html += `<div class="twocol">
      ${assocIn.length ? `<section><header><h2>Odkazují sem</h2><span class="count">${assocIn.length}</span></header>
        <div class="chips">${assocIn.map(u => `<a class="chip" href="#c-${u.from}">${esc(u.from)}.${esc(u.role)}</a>`).join('')}</div></section>` : ''}
      ${asType.length ? `<section><header><h2>Použito jako typ</h2><span class="count">${asType.length}</span></header>
        <div class="chips">${asType.map(u => `<a class="chip" href="#c-${u.from}">${esc(u.from)}.${esc(u.role)}</a>`).join('')}</div></section>` : ''}
    </div>`;

    if (diags.length) html += `<section><header><h2>V diagramech</h2></header><div class="mini">${diags.map(d => {
      const b = BOXES[d.key].boxes.find(x => x.name === e.name);
      return `<a href="#d-${d.key}" data-flash="${esc(e.name)}"><div class="crop" data-w="${BOXES[d.key].width}" data-bx="${b.x},${b.y},${b.w},${b.h}"><img src="${IMG[d.key]}" alt=""></div>${esc(d.title)}</a>`;
    }).join('')}</div></section>`;

    view.innerHTML = html + footer();

    view.querySelectorAll('[data-flash]').forEach(a => a.addEventListener('click', () => { state.flash = a.dataset.flash; }));
    view.querySelectorAll('.tag.rule').forEach(t => t.addEventListener('click', () => {
      const m = t.dataset.rule;
      view.querySelectorAll('.rules li').forEach(li => li.classList.toggle('lit', li.dataset.member === m));
      document.getElementById('rules')?.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
    }));
    // crop the diagram thumbnail around this element's box
    view.querySelectorAll('.crop').forEach(c => {
      const [x, y, w, h] = c.dataset.bx.split(',').map(Number), W = +c.dataset.w;
      const place = () => {
        const cw = c.clientWidth, ch = c.clientHeight, pad = 40;
        const s = Math.min(cw / (w + pad * 2), ch / (h + pad * 2), 1.2);
        const img = c.querySelector('img');
        img.style.width = W * s + 'px';
        img.style.left = (cw / 2 - (x + w / 2) * s) + 'px';
        img.style.top = (ch / 2 - (y + h / 2) * s) + 'px';
      };
      place();
      new ResizeObserver(place).observe(c);
    });
  }

  function notFound() {
    view.innerHTML = `<div class="head"><h1>Prvek nenalezen</h1><p class="lede">Odkaz míří na prvek, který v modelu není. <a href="#prehled">Zpět na přehled</a>.</p></div>`;
  }
  function footer() {
    return `<footer>Vygenerováno z exportu <code>hobbyhub.xmi</code> a obrázků diagramů z Modelia. Násobnost bez uvedení znamená právě 1; lomítko před názvem označuje odvozený atribut.</footer>`;
  }

  function route() {
    const h = decodeURIComponent(location.hash.slice(1));
    if (h.startsWith('d-')) diagram(h.slice(2));
    else if (h.startsWith('c-')) sheet(h.slice(2));
    else overview();
    markActive();
    if (h && !state.keepScroll) window.scrollTo(0, 0);
    view.focus({ preventScroll: true });
  }
  window.addEventListener('hashchange', route);
  renderNav();
  route();
})();
</script>
