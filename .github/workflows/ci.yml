name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      # Same image, credentials and host port as apps/backend/docker-compose.yml,
      # so the .env created by `pnpm env:check` points at it unchanged.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: quacker
          POSTGRES_PASSWORD: quacker
          POSTGRES_DB: quacker
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U quacker -d quacker"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5

      - name: Check migrations order
        if: github.event_name == 'pull_request'
        run: scripts/check-migrations-order.sh "origin/${{ github.base_ref }}"

      - name: Check migrations on base branch are unchanged
        if: github.event_name == 'pull_request'
        run: scripts/check-migrations-frozen.sh "origin/${{ github.base_ref }}"

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create env files
        run: pnpm env:check

      - name: Generate Prisma client
        run: pnpm backend prisma:generate

      # Replays every migration into an empty database in timestamp order,
      # exactly as `prisma migrate deploy` does on a fresh deployment.
      - name: Apply migrations to an empty database
        run: pnpm backend migrate

      # Exit code 2 when the migrated database differs from schema.prisma:
      # a schema change without a migration, or two parallel migrations that
      # merged cleanly in git but do not add up to the schema.
      - name: Check migrations match schema.prisma
        run: pnpm backend exec prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

      - name: Format check
        run: pnpm format:check

      - name: Lint backend
        run: pnpm backend lint:check

      - name: Lint frontend
        run: pnpm frontend lint:check

      - name: Type-check frontend
        run: pnpm frontend type-check

      - name: Apply database migrations
        run: pnpm backend migrate

      - name: Test backend
        run: pnpm backend test
        env:
          # Jest does not read apps/backend/.env; PrismaService takes the
          # connection string from the process environment.
          DATABASE_URL: postgresql://quacker:quacker@localhost:5433/quacker
          DB_TESTS: '1'

      - name: Test frontend
        run: pnpm frontend test:ci

      - name: Build backend
        run: pnpm backend build

      - name: Build frontend
        run: pnpm frontend build
