name: Build & Deploy
on:
  push:
    branches: [main]
  workflow_dispatch: {}
env:
  COURSE_DOMAIN: vsepractical.applifting.dev
  REGISTRY: registry.vsepractical.applifting.dev
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      # The slug names the Coolify app, its domain and the images it pulls from the
      # registry. It comes from the DEPLOY_SLUG repository variable (Settings →
      # Secrets and variables → Actions → Variables) and is deliberately NOT derived
      # from the repository name: renaming the repo must not silently retarget the deploy.
      - name: Determine slug
        id: slug
        env:
          DEPLOY_SLUG: ${{ vars.DEPLOY_SLUG }}
        run: |
          if [ -z "$DEPLOY_SLUG" ]; then
            echo "::error::Repository variable DEPLOY_SLUG is not set. Set it to the team slug (e.g. team-2) in repository settings."
            exit 1
          fi
          SLUG="${DEPLOY_SLUG,,}"
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          echo "url=https://$SLUG.$COURSE_DOMAIN" >> "$GITHUB_OUTPUT"
      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: registry.vsepractical.applifting.dev
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile.deploy
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.slug.outputs.slug }}-backend:latest
      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/frontend/Dockerfile.deploy
          push: true
          build-args: |
            VITE_API_URL=${{ steps.slug.outputs.url }}/api
            VITE_BETTER_AUTH_URL=${{ steps.slug.outputs.url }}
            VITE_MAPBOX_TOKEN=${{ vars.VITE_MAPBOX_TOKEN }}
          tags: ${{ env.REGISTRY }}/${{ steps.slug.outputs.slug }}-frontend:latest
      - name: Trigger Coolify deploy
        if: env.COOLIFY_WEBHOOK != ''
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $COOLIFY_TOKEN" "$COOLIFY_WEBHOOK"
