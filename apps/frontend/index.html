<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="theme-color"
      content="#fbfafc"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#15121c"
      media="(prefers-color-scheme: dark)"
    />
    <meta
      name="description"
      content="HobbyHub — doplň soupisku na sport a koníčky. Najdi akci, kde chybí lidi, a obsaď místo."
    />
    <!-- #215: what a shared link shows. Previews do not run JavaScript, so
         these stay here; the pages only change the title and description. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="HobbyHub" />
    <meta property="og:title" content="HobbyHub — najdi akci, parta přijde sama" />
    <meta
      property="og:description"
      content="Fotbal, deskovky, výlety: akce s volným místem kousek od tebe. Přidej se, zahraj si a najdi partu."
    />
    <meta property="og:image" content="/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>HobbyHub</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
